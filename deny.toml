[licenses]
confidence-threshold = 0.8

allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
]

unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# RUSTSEC-2024-0436: paste v1.0.15 is unmaintained.
# Linux-only transitive dep via netlink-packet-utils (libp2p networking stack).
# No safe upgrade path — pinned by libp2p v0.56.0. Proc-macro only, no runtime risk.
# Monitor: https://rustsec.org/advisories/RUSTSEC-2024-0436
#
# RUSTSEC-2026-0002: lru v0.12.5 IterMut soundness issue.
# Transitive dep via libp2p-swarm v0.47.0 — no patched version available.
# lru is not used directly; risk is limited to libp2p's internal connection management.
# Monitor: https://rustsec.org/advisories/RUSTSEC-2026-0002
#
# RUSTSEC-2025-0134: rustls-pemfile v1.0.4 is unmaintained.
# Transitive dep via reqwest v0.11.27 (used only by tx-generator tool, not consensus).
# No safe upgrade path available. Monitor for reqwest update.
# Monitor: https://rustsec.org/advisories/RUSTSEC-2025-0134
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2026-0002", "RUSTSEC-2025-0134"]



