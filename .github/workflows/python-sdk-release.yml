name: Python SDK Release

on:
  push:
    tags:
      - "python-sdk-v*"

jobs:
  gates:
    name: Re-run gates before publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/novai-python-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: pytest
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy

  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: [gates]
    environment:
      name: pypi-release
      url: https://pypi.org/project/novai-sdk/
    defaults:
      run:
        working-directory: sdk/novai-python-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#python-sdk-v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) != pyproject.toml version ($PYPROJECT_VERSION)"
            exit 1
          fi
          echo "Version match: $TAG_VERSION"
      - name: Build distributions
        run: python -m build
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
