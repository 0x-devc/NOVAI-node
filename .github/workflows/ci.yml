name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install LLVM and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-dev libclang-dev

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --all --all-features

      # The golden-vector suites rewrite their `.bin` files when UPDATE_VECTORS=1.
      # Regeneration is a deliberate act that belongs in its own reviewed commit,
      # so a test run that leaves any tracked file modified fails the build rather
      # than letting the drift through unnoticed. Note this catches modifications
      # to tracked files, not the creation of new untracked ones.
      - name: No tracked file was modified by the test run
        run: git diff --exit-code

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Cargo deny (licenses)
        run: cargo deny check licenses