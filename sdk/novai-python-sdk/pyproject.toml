[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "novai-sdk"
version = "0.1.0"
description = "Pure-Python SDK for the NOVAI blockchain (entities, payments, channels, SLAs, oracles, conditional execution)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "NOVAI Network" },
]
keywords = ["novai", "blockchain", "ai-agents", "ed25519", "json-rpc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pynacl>=1.5.0",
    "blake3>=0.4.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "aioresponses>=0.7.6",
]

[project.urls]
Homepage = "https://github.com/0x-devc/NOVAI-node"
Repository = "https://github.com/0x-devc/NOVAI-node"
Issues = "https://github.com/0x-devc/NOVAI-node/issues"

[tool.hatch.build.targets.wheel]
packages = ["novai_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "novai_sdk/",
    "tests/",
    "examples/",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require a running NOVAI devnet (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
files = ["novai_sdk"]

[[tool.mypy.overrides]]
module = ["nacl.*", "blake3.*", "aiohttp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aioresponses.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter where it matters)
    "B008",   # function calls in argument defaults (common for dataclass defaults)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
