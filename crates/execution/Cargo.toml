[package]
name = "novai-execution"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
novai-types = { path = "../types", version = "0.1.0" }
novai-state = { path = "../state", version = "0.1.0" }
novai-smt = { path = "../smt", version = "0.1.0" }
novai-ai-entities = { path = "../ai_entities", version = "0.1.0" }
novai-codec = { path = "../codec", version = "0.1.0" }
novai-governance = { path = "../governance", version = "0.1.0" }
novai-crypto = { path = "../crypto", version = "0.1.0" }
blake3 = "=1.8.2"

[dev-dependencies]
# Used by tests/verification_system.rs to generate real Groth16 proofs
# and feed them through the ProofSubmission signal pipeline. Same pins
# and feature config as crates/crypto so the integration tests exercise
# the same verifier surface as the unit tests.
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["curve"] }
ark-groth16 = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-relations = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-serialize = { version = "=0.5.0", default-features = false, features = ["derive", "std"] }
ark-std = { version = "=0.5.0", default-features = false, features = ["std"] }

[lints]
workspace = true