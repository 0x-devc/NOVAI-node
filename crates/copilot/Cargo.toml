[package]
name = "novai-copilot"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Validator Co-Pilot: Statistics-based anomaly detection for NOVAI"

[dependencies]
# Internal crates
novai-types = { path = "../types", version = "0.1.0" }
novai-ai-entities = { path = "../ai_entities", version = "0.1.0" }
novai-crypto = { path = "../crypto", version = "0.1.0" }

# Crypto for signing
ed25519-dalek = "2.1"
tracing = "0.1"

[dev-dependencies]
mempool = { path = "../mempool", version = "0.1.0" }
novai-codec = { path = "../codec", version = "0.1.0" }
