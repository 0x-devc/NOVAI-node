[package]
name = "novai-node"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "novai-node"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
mempool = { path = "../mempool", version = "0.1.0" }
novai-types = { path = "../types", version = "0.1.0" }
novai-crypto = { path = "../crypto", version = "0.1.0" }
novai-codec = { path = "../codec", version = "0.1.0" }
novai-consensus = { path = "../consensus", version = "0.1.0" }
novai-consensus-types = { path = "../consensus_types", version = "0.1.0" }
novai-state = { path = "../state", version = "0.1.0" }
novai-execution = { path = "../execution", version = "0.1.0" }
novai-p2p = { path = "../p2p", version = "0.1.0" }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal"] }
futures = "0.3"
libp2p = { version = "0.56", default-features = false, features = [
  "tcp",
  "dns",
  "noise",
  "yamux",
  "ping",
  "identify",
  "mdns",
  "gossipsub",
  "tokio",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "=2.1.1"
rand_core = { version = "0.6", features = ["getrandom"] }
tiny_http = "0.12"
hex = "0.4"


[dev-dependencies]
proptest = "~1.4"
