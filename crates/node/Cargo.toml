[package]
name = "novai-node"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "novai-node"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
mempool = { path = "../mempool", version = "0.1.0" }
novai-types = { path = "../types", version = "0.1.0" }
novai-crypto = { path = "../crypto", version = "0.1.0" }
novai-codec = { path = "../codec", version = "0.1.0" }
novai-consensus = { path = "../consensus", version = "0.1.0" }
novai-consensus-types = { path = "../consensus_types", version = "0.1.0" }
novai-state = { path = "../state", version = "0.1.0", features = ["rocksdb"] }
novai-execution = { path = "../execution", version = "0.1.0" }
# The SMT GC census walks the rebuilt tree from its root to count the LIVE node
# set, which needs the node encoding. Already in the build as a transitive
# dependency of novai-state and novai-execution; naming it here is what lets the
# reachability walk read node rows through the real decoder rather than
# reimplementing a 67-byte layout that consensus depends on.
novai-smt = { path = "../smt", version = "0.1.0" }
novai-ai-entities = { path = "../ai_entities", version = "0.1.0" }
novai-p2p = { path = "../p2p", version = "0.1.0" }
novai-copilot = { path = "../copilot", version = "0.1.0" }
novai-ai-service = { path = "../ai_service", version = "0.1.0" }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "=2.1.1"
# Gate F5 Stage 2: per-chunk snapshot digests. Pinned to the same version the
# rest of the workspace hashes with, so a digest computed here and a hash
# computed in novai-crypto or novai-smt can never come from different code.
blake3 = "=1.8.2"
tiny_http = "0.12"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
