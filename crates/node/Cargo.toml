[package]
name = "novai-node"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "novai-node"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
novai-crypto = { path = "../crypto" }
novai-codec = { path = "../codec" }
novai-consensus = { path = "../consensus" }
novai-consensus-types = { path = "../consensus_types" }
novai-state = { path = "../state" }
novai-execution = { path = "../execution" }
mempool = { path = "../mempool" }
novai-types = { path = "../types" }
novai-p2p = { path = "../p2p" }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal"] }
futures = "0.3"
libp2p = { version = "0.56", default-features = false, features = [
  "tcp",
  "dns",
  "noise",
  "yamux",
  "ping",
  "identify",
  "mdns",
  "gossipsub",
  "tokio",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "=2.1.1"
rand_core = { version = "0.6", features = ["getrandom"] }
