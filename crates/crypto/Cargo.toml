[package]
name = "novai-crypto"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
default = []
# Enable logging for ZK stub verifier (for debugging)
zk-logging = []

[dependencies]
novai-types = { path = "../types", version = "0.1.0" }
novai-codec = { path = "../codec", version = "0.1.0" }
blake3 = "=1.8.2"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["curve"] }
ark-groth16 = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-ec = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-ff = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-serialize = { version = "=0.5.0", default-features = false, features = ["derive", "std"] }
ark-relations = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-std = { version = "=0.5.0", default-features = false, features = ["std"] }
