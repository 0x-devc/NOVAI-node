[package]
name = "tx-generator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "tx-generator"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Error handling
anyhow = "1.0"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography (must match novai-crypto)
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# Performance metrics
hdrhistogram = "7.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client for RPC
reqwest = { version = "0.11", features = ["json"] }

# Hex encoding for transaction bytes
hex = "0.4"

# Local workspace dependencies
novai-types = { path = "../../crates/types" }
novai-crypto = { path = "../../crates/crypto" }
novai-codec = { path = "../../crates/codec" }
