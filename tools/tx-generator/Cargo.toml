[package]
name = "tx-generator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "tx-generator"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Error handling
anyhow = "1.0"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography (must match novai-crypto)
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# Performance metrics
hdrhistogram = "7.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client for RPC
reqwest = { version = "0.11", features = ["json"] }

# Hex encoding for transaction bytes
hex = "0.4"

# Local workspace dependencies
novai-types = { path = "../../crates/types" }
novai-crypto = { path = "../../crates/crypto" }
novai-codec = { path = "../../crates/codec" }
# For MAX_PENDING_PER_SENDER. Imported rather than mirrored: the generator's
# idea of the node's per-sender slot cap must never drift from the node's.
mempool = { path = "../../crates/mempool" }

[dev-dependencies]
# HTTP mock server for integration tests that exercise worker recovery
# without standing up a full devnet. MIT-licensed.
mockito = "1.6"
# Test-only tokio features (pause/advance/start_paused) so retry-loop
# bound tests complete in test budget rather than real-time backoff.
tokio = { version = "1.42", features = ["full", "test-util"] }
