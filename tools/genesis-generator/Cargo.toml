[package]
name = "genesis-generator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Deterministic genesis state generator for NOVAI mainnet"

[[bin]]
name = "genesis-generator"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hex encoding for output
hex = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Local workspace dependencies
genesis = { path = "../../crates/genesis" }
novai-state = { path = "../../crates/state" }
novai-consensus-types = { path = "../../crates/consensus_types" }

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
